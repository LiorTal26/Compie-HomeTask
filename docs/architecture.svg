<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1110" viewBox="0 0 1480 1110" role="img" aria-labelledby="title desc">
<title id="title">Compie Items Board AWS architecture</title>
<desc id="desc">A public ALB spans two public subnets. An EC2 Auto Scaling Group runs a Flask container in two private subnets. DynamoDB is reached through a gateway endpoint. GitHub Actions releases immutable ECR images. AWS-managed KMS protects the database and runtime configuration. CloudWatch sends alarms through SNS to SQS.</desc>
