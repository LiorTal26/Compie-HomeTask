name: Infrastructure

on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infrastructure.yml']
  workflow_dispatch:
    inputs:
      operation:
        description: Plan or explicitly apply the dev infrastructure
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read
  id-token: write

concurrency:
  group: compie-dev-write
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'il-central-1' }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'il-central-1' }}
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VAR_domain_name: ${{ vars.APPLICATION_DOMAIN || '' }}
  TF_VAR_hosted_zone_id: ${{ vars.ROUTE53_ZONE_ID || '' }}

jobs:
  terraform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Format and validate
        run: |
          terraform fmt -check -recursive infra
          terraform -chdir=infra/bootstrap init -backend=false -lockfile=readonly
          terraform -chdir=infra/bootstrap validate
          terraform -chdir=infra/dev init -backend=false -lockfile=readonly
          terraform -chdir=infra/dev validate
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.INFRASTRUCTURE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: compie-infra-${{ github.run_id }}
      - name: Initialize dev backend and plan
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$STATE_BUCKET"
          terraform -chdir=infra/dev init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          if terraform -chdir=infra/dev state list | grep -q '^aws_lb_listener\.https'; then
            if [ -z "$TF_VAR_domain_name" ] || [ -z "$TF_VAR_hosted_zone_id" ]; then
              echo "HTTPS already exists. Set APPLICATION_DOMAIN and ROUTE53_ZONE_ID; refusing to plan its removal with empty inputs."
              exit 1
            fi
          fi
          terraform -chdir=infra/dev plan -no-color -lock-timeout=5m -out=dev.tfplan
      - name: Apply the plan from this run
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
        run: |
          terraform -chdir=infra/dev apply -no-color -lock-timeout=5m dev.tfplan
          for attempt in $(seq 1 90); do
            status=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name compie-dev-asg --query 'InstanceRefreshes[0].Status' --output text)
            case "$status" in
              None|Successful) break;;
              Failed|Cancelled|RollbackFailed|RollbackSuccessful) echo "Refresh ended: $status"; exit 1;;
            esac
            sleep 10
          done
          case "$status" in None|Successful) ;; *) echo "Refresh timed out."; exit 1;; esac
          app_url=$(terraform -chdir=infra/dev output -raw application_url)
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "$app_url/health" | jq -e '.database == "ok"'
          printf '### Dev environment\n\nApplication: %s\n\nCommit: %s\n' "$app_url" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
