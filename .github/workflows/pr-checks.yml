name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false

      - name: Format and validate both Terraform roots
        run: |
          terraform fmt -check -recursive infra
          terraform -chdir=infra/bootstrap init -backend=false -lockfile=readonly
          terraform -chdir=infra/bootstrap validate
          terraform -chdir=infra/dev init -backend=false -lockfile=readonly
          terraform -chdir=infra/dev validate

  application:
    name: Container build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build the application image
        run: docker build --platform linux/amd64 -t compie:pr .

      - name: Run application tests inside the image
        run: docker run --rm --entrypoint python -v "$PWD/tests:/app/tests:ro" compie:pr -m unittest discover -s tests -v
